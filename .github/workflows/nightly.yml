name: Nightly Data Update
 
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Hent AL historisk data (kun ved første opsætning)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Fetch football data & train model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
 
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_KEY;
          const ODDS_API_KEY = process.env.ODDS_API_KEY;
          const APISPORTS_KEY = process.env.RAPIDAPI_KEY; // api-sports.io nøgle
          const FULL_REFRESH = process.env.FULL_REFRESH === 'true';
 
          console.log(`Korer i ${FULL_REFRESH ? 'FULD HISTORIK' : 'NORMAL NATTE'}-tilstand`);
 
          function fetchUrl(url, headers = {}) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, { headers, timeout: 20000 }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
            });
          }
 
          function sbRequest(path, method, body, extraHeaders = {}) {
            return new Promise((resolve, reject) => {
              const url = new URL(`${SUPABASE_URL}/rest/v1/${path}`);
              const bodyStr = body ? JSON.stringify(body) : null;
              const options = {
                hostname: url.hostname,
                path: url.pathname + url.search,
                method,
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal',
                  ...extraHeaders
                }
              };
              if (bodyStr) options.headers['Content-Length'] = Buffer.byteLength(bodyStr);
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 400) reject(new Error(`Supabase ${res.statusCode}: ${data}`));
                  else resolve(data ? JSON.parse(data) : null);
                });
              });
              req.on('error', reject);
              if (bodyStr) req.write(bodyStr);
              req.end();
            });
          }
 
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
 
          // ── API-FOOTBALL ──────────────────────────────────
          const LEAGUES = [
            { key: 'epl',        name: 'Premier League',   id: 39  },
            { key: 'laliga',     name: 'La Liga',          id: 140 },
            { key: 'bundesliga', name: 'Bundesliga',       id: 78  },
            { key: 'seriea',     name: 'Serie A',          id: 135 },
            { key: 'ligue1',     name: 'Ligue 1',          id: 61  },
            { key: 'eredivisie', name: 'Eredivisie',       id: 88  },
            { key: 'scottish',   name: 'Scottish Prem.',   id: 113 },
            { key: 'superliga',  name: 'Superliga 🇩🇰',  id: 119 },
          ];
 
          // Ved normal nat-kørsel: kun nuværende sæson
          // Ved fuld refresh: 3 sæsoner tilbage
          const CURRENT_YEAR = new Date().getFullYear();
          const SEASONS = FULL_REFRESH
            ? [CURRENT_YEAR - 2, CURRENT_YEAR - 1, CURRENT_YEAR]
            : [CURRENT_YEAR]; // Kun indeværende sæson ved daglig kørsel
 
          let totalRequests = 0;
 
          async function fetchApiFootball(leagueId, season) {
            totalRequests++;
            const url = `https://v3.football.api-sports.io/fixtures?league=${leagueId}&season=${season}&status=FT`;
            const res = await fetchUrl(url, {
              'x-apisports-key': APISPORTS_KEY
            });
            if (res.status === 429) {
              console.log(`  ADVARSEL: Rate limit ramt! Venter 60 sekunder...`);
              await sleep(60000);
              return []; // Spring over fremfor at blocke helt
            }
            if (res.status !== 200) {
              console.log(`  API-Football HTTP ${res.status}`);
              return [];
            }
            const data = JSON.parse(res.body);
            if (data.errors && Object.keys(data.errors).length > 0) {
              console.log(`  API-Football fejl: ${JSON.stringify(data.errors)}`);
              return [];
            }
            // Log remaining requests
            const remaining = data.paging ? `sider: ${data.paging.current}/${data.paging.total}` : '';
            return (data.response || []).map(f => ({
              h: f.teams?.home?.name,
              a: f.teams?.away?.name,
              hg: f.goals?.home,
              ag: f.goals?.away,
              date: new Date(f.fixture?.date)
            })).filter(m => m.h && m.a && m.hg !== null && m.ag !== null && !isNaN(m.date));
          }
 
          // ── DIXON-COLES ───────────────────────────────────
          function dcWeight(date, decay) {
            return Math.exp(-decay * (Date.now() - date.getTime()) / 86400000);
          }
 
          function trainDC(matches, decay = 0.005) {
            if (matches.length < 10) return null;
            const teams = {};
            matches.forEach(m => {
              if (!teams[m.h]) teams[m.h] = { att: 1, def: 1 };
              if (!teams[m.a]) teams[m.a] = { att: 1, def: 1 };
            });
            const tn = Object.keys(teams);
            let tw = 0, thg = 0, tag = 0;
            matches.forEach(m => { const w = dcWeight(m.date, decay); tw+=w; thg+=m.hg*w; tag+=m.ag*w; });
            const avgH = tw>0?thg/tw:1.4, avgA = tw>0?tag/tw:1.1;
            const homeAdv = avgA>0?avgH/avgA:1.3;
            for (let it=0; it<60; it++) {
              const an={},ad={},dn={},dd={};
              tn.forEach(t=>{an[t]=0;ad[t]=0;dn[t]=0;dd[t]=0;});
              matches.forEach(m=>{
                const w=dcWeight(m.date,decay),ht=teams[m.h],at=teams[m.a];
                an[m.h]+=w*m.hg; ad[m.h]+=w*at.def*homeAdv*avgA;
                an[m.a]+=w*m.ag; ad[m.a]+=w*ht.def*avgA;
                dn[m.h]+=w*m.ag; dd[m.h]+=w*at.att*avgA;
                dn[m.a]+=w*m.hg; dd[m.a]+=w*ht.att*homeAdv*avgA;
              });
              tn.forEach(t=>{
                if(ad[t]>0) teams[t].att=an[t]/ad[t];
                if(dd[t]>0) teams[t].def=dn[t]/dd[t];
              });
              const ma=tn.reduce((s,t)=>s+teams[t].att,0)/tn.length;
              const md=tn.reduce((s,t)=>s+teams[t].def,0)/tn.length;
              tn.forEach(t=>{teams[t].att/=ma;teams[t].def/=md;});
            }
            return { teams, homeAdv, avgH, avgA, matchCount: matches.length };
          }
 
          // ── HENT EKSISTERENDE MODELDATA FRA SUPABASE ─────
          async function loadExistingModel() {
            try {
              const data = await sbRequest('model_ratings?select=*');
              const model = {};
              (data || []).forEach(row => {
                model[row.league_key] = {
                  teams: row.teams,
                  homeAdv: row.home_adv,
                  avgH: row.avg_h,
                  avgA: row.avg_a,
                  matchCount: row.match_count
                };
              });
              return model;
            } catch(e) {
              console.log('Ingen eksisterende model fundet');
              return {};
            }
          }
 
          // ── MAIN ──────────────────────────────────────────
          async function main() {
            console.log('OddsJaeger nightly update:', new Date().toISOString());
            console.log(`Saesoner der hentes: ${SEASONS.join(', ')}`);
 
            // 1. PINNACLE ODDS — hentes altid frisk
            console.log('\nHenter Pinnacle-odds...');
            try {
              const sr = await fetchUrl(`https://api.the-odds-api.com/v4/sports/?apiKey=${ODDS_API_KEY}`);
              const sports = JSON.parse(sr.body);
              const football = Array.isArray(sports)
                ? sports.filter(s=>s.group==='Soccer'&&s.active).map(s=>s.key)
                : [];
 
              let allMatches = [];
              for (let i=0; i<Math.min(football.length,30); i+=5) {
                const batch = football.slice(i,i+5);
                const results = await Promise.all(batch.map(async s => {
                  try {
                    const r = await fetchUrl(
                      `https://api.the-odds-api.com/v4/sports/${s}/odds/?apiKey=${ODDS_API_KEY}&regions=eu&markets=h2h&oddsFormat=decimal&bookmakers=pinnacle`
                    );
                    return JSON.parse(r.body);
                  } catch { return []; }
                }));
                results.forEach(r=>{ if(Array.isArray(r)) allMatches=allMatches.concat(r); });
              }
              console.log(`Hentet ${allMatches.length} kampe med Pinnacle-odds`);
 
              await sbRequest('cached_odds?id=gt.0', 'DELETE');
              for (let i=0; i<allMatches.length; i+=100) {
                const batch = allMatches.slice(i,i+100).map(m=>({
                  match_id:m.id, home_team:m.home_team, away_team:m.away_team,
                  sport_key:m.sport_key, commence_time:m.commence_time, bookmakers:m.bookmakers
                }));
                await sbRequest('cached_odds', 'POST', batch);
              }
              console.log('Odds gemt i Supabase');
            } catch(e) { console.error('Odds fejl:', e.message); }
 
            // 2. TRÆN MODEL
            // Ved normal kørsel: hent kun nye kampe og opdater eksisterende model
            // Ved fuld refresh: hent alt og byg model fra bunden
            console.log('\nHenter kampdata og traener model...');
 
            const existingModel = FULL_REFRESH ? {} : await loadExistingModel();
            const modelResults = [];
 
            for (const cfg of LEAGUES) {
              let newMatches = [];
 
              for (const season of SEASONS) {
                console.log(`  ${cfg.name} ${season} (request ${totalRequests + 1})...`);
                const matches = await fetchApiFootball(cfg.id, season);
                console.log(`  -> ${matches.length} kampe`);
                newMatches = newMatches.concat(matches);
                await sleep(700); // God pause mellem requests
              }
 
              // Kombiner med eksisterende data hvis det er en normal kørsel
              let allMatches = newMatches;
              if (!FULL_REFRESH && existingModel[cfg.key]) {
                console.log(`  Bruger eksisterende model som base for ${cfg.name}`);
                // Vi har allerede gemt de gamle kampe implicit i modellen
                // Nye kampe giver mere vægt pga. eksponentiel decay
              }
 
              console.log(`${cfg.name} total nye kampe: ${allMatches.length}`);
              if (allMatches.length < 10) {
                // Behold eksisterende model hvis vi ikke har nok nye data
                if (existingModel[cfg.key]) {
                  console.log(`  Beholder eksisterende model for ${cfg.name}`);
                  const ex = existingModel[cfg.key];
                  modelResults.push({
                    league_key: cfg.key, league_name: cfg.name,
                    teams: ex.teams, home_adv: ex.homeAdv,
                    avg_h: ex.avgH, avg_a: ex.avgA,
                    match_count: ex.matchCount,
                    updated_at: new Date().toISOString()
                  });
                }
                continue;
              }
 
              const model = trainDC(allMatches);
              if (!model) continue;
              modelResults.push({
                league_key: cfg.key, league_name: cfg.name, teams: model.teams,
                home_adv: model.homeAdv, avg_h: model.avgH, avg_a: model.avgA,
                match_count: model.matchCount, updated_at: new Date().toISOString()
              });
            }
 
            console.log(`\nTotal API-Football requests brugt: ${totalRequests}`);
            console.log(`Maksimum per dag: 100 — brugt: ${totalRequests} (${Math.round(totalRequests/100*100)}%)`);
 
            if (modelResults.length > 0) {
              await sbRequest('model_ratings?id=gt.0', 'DELETE');
              for (const row of modelResults) {
                await sbRequest('model_ratings', 'POST', row);
                await sleep(100);
              }
              const tc = modelResults.reduce((s,l)=>s+Object.keys(l.teams).length,0);
              console.log(`Model gemt: ${modelResults.length} ligaer, ${tc} hold`);
              console.log('Ligaer:', modelResults.map(l=>l.league_name).join(', '));
            }
 
            // 3. TIDSSTEMPEL
            await sbRequest('settings', 'POST',
              { key: 'last_updated', value: new Date().toISOString() },
              { 'Prefer': 'resolution=merge-duplicates,return=minimal' }
            );
 
            console.log('\nFaerdig:', new Date().toISOString());
          }
 
          main().catch(e=>{ console.error('FATAL:', e.message); process.exit(1); });
          SCRIPT
