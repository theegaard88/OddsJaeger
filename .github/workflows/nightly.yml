name: Nightly Data Update
 
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Hent AL historisk data (kun ved første opsætning)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Fetch football data & train model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APISPORTS_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
 
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_KEY;
          const ODDS_API_KEY = process.env.ODDS_API_KEY;
          const APISPORTS_KEY = process.env.APISPORTS_KEY;
          const SPORTMONKS_KEY = process.env.SPORTMONKS_KEY;
          const FULL_REFRESH = process.env.FULL_REFRESH === 'true';
 
          console.log(`Tilstand: ${FULL_REFRESH ? 'FULD HISTORIK' : 'NATKØRSEL'}`);
 
          function fetchUrl(url, headers = {}) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, { headers, timeout: 20000 }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
            });
          }
 
          function sbRequest(path, method, body, extraHeaders = {}) {
            return new Promise((resolve, reject) => {
              const url = new URL(`${SUPABASE_URL}/rest/v1/${path}`);
              const bodyStr = body ? JSON.stringify(body) : null;
              const options = {
                hostname: url.hostname,
                path: url.pathname + url.search,
                method,
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal',
                  ...extraHeaders
                }
              };
              if (bodyStr) options.headers['Content-Length'] = Buffer.byteLength(bodyStr);
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 400) reject(new Error(`Supabase ${res.statusCode}: ${data}`));
                  else resolve(data ? JSON.parse(data) : null);
                });
              });
              req.on('error', reject);
              if (bodyStr) req.write(bodyStr);
              req.end();
            });
          }
 
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
 
          // ── OPENFOOTBALL (GitHub, ingen API-nøgle) ────────
          // Dækker: EPL, Bundesliga, La Liga, Serie A, Ligue 1, Eredivisie
          // Sæsoner: 2022-23, 2023-24, 2024-25, 2025-26
          const OPENFOOTBALL_LEAGUES = [
            { key: 'epl',        name: 'Premier League', file: 'en.1.json' },
            { key: 'bundesliga', name: 'Bundesliga',     file: 'de.1.json' },
            { key: 'laliga',     name: 'La Liga',        file: 'es.1.json' },
            { key: 'seriea',     name: 'Serie A',        file: 'it.1.json' },
            { key: 'ligue1',     name: 'Ligue 1',        file: 'fr.1.json' },
            { key: 'eredivisie', name: 'Eredivisie',     file: 'nl.1.json' },
            { key: 'scottish',   name: 'Scottish Prem.', file: 'sco.1.json' },
          ];
 
          const SEASONS = FULL_REFRESH
            ? ['2022-23', '2023-24', '2024-25', '2025-26']
            : ['2025-26']; // Kun indeværende sæson ved daglig kørsel
 
          async function fetchOpenfootball(season, file) {
            const url = `https://raw.githubusercontent.com/openfootball/football.json/master/${season}/${file}`;
            try {
              const res = await fetchUrl(url);
              if (res.status !== 200) { console.log(`  HTTP ${res.status}`); return []; }
              const data = JSON.parse(res.body);
              const matches = [];
              for (const round of (data.rounds || data.matches || [])) {
                const games = round.matches || (round.date ? [round] : []);
                for (const m of games) {
                  if (!m.score?.ft) continue;
                  const date = new Date(m.date || '');
                  if (isNaN(date.getTime())) continue;
                  matches.push({
                    h: m.team1, a: m.team2,
                    hg: m.score.ft[0], ag: m.score.ft[1],
                    date
                  });
                }
              }
              return matches;
            } catch(e) { console.log(`  Fejl: ${e.message}`); return []; }
          }
 
          // ── API-FOOTBALL (Superliga 2022-2024) ────────────
          async function fetchApiFootball(leagueId, season) {
            const url = `https://v3.football.api-sports.io/fixtures?league=${leagueId}&season=${season}&status=FT`;
            const res = await fetchUrl(url, { 'x-apisports-key': APISPORTS_KEY });
            if (res.status === 429) { await sleep(60000); return []; }
            if (res.status !== 200) return [];
            const data = JSON.parse(res.body);
            if (data.errors && Object.keys(data.errors).length > 0) return [];
            return (data.response || []).map(f => ({
              h: f.teams?.home?.name, a: f.teams?.away?.name,
              hg: f.goals?.home, ag: f.goals?.away,
              date: new Date(f.fixture?.date)
            })).filter(m => m.h && m.a && m.hg !== null && m.ag !== null && !isNaN(m.date));
          }
 
          // ── SPORTMONKS (Superliga 2024-25, 2025-26) ───────
          async function fetchSportmonksSuperliga() {
            const matches = [];
            try {
              // Hent sæsoner direkte fra seasons endpoint
              const seasonsRes = await fetchUrl(
                `https://api.sportmonks.com/v3/football/seasons?api_token=${SPORTMONKS_KEY}&filters=leagueId:172&per_page=25`
              );
              if (seasonsRes.status !== 200) {
                console.log(`  Sportmonks seasons HTTP: ${seasonsRes.status}`);
                return matches;
              }
              const seasonsData = JSON.parse(seasonsRes.body);
              const cutoff = new Date();
              cutoff.setFullYear(cutoff.getFullYear() - (FULL_REFRESH ? 3 : 1));
              const allSeasons = seasonsData.data || [];
              console.log(`  Alle Sportmonks sæsoner: ${allSeasons.map(s=>s.name).join(', ')}`);
              const seasons = allSeasons.filter(s => {
                const end = new Date(s.ending_at || s.starting_at || '');
                return end >= cutoff;
              });
              console.log(`  Filtrerede sæsoner: ${seasons.map(s=>s.name).join(', ')}`);
 
              for (const season of seasons) {
                let page = 1, lastPage = 1;
                while (page <= lastPage) {
                  const url = `https://api.sportmonks.com/v3/football/fixtures?api_token=${SPORTMONKS_KEY}&filters=fixtureLeagues:172;fixtureSeason:${season.id}&include=scores;participants&per_page=50&page=${page}`;
                  const res = await fetchUrl(url);
                  if (res.status !== 200) break;
                  const data = JSON.parse(res.body);
                  lastPage = data.pagination?.last_page || 1;
                  for (const f of (data.data || [])) {
                    if (!f.scores?.length || !f.participants?.length) continue;
                    let hg = null, ag = null;
                    for (const s of f.scores) {
                      if (s.description === 'CURRENT') {
                        if (s.score?.participant === 'home') hg = parseInt(s.score.goals);
                        if (s.score?.participant === 'away') ag = parseInt(s.score.goals);
                      }
                    }
                    if (hg === null || ag === null) continue;
                    const home = f.participants.find(p => p.meta?.location === 'home');
                    const away = f.participants.find(p => p.meta?.location === 'away');
                    if (!home || !away) continue;
                    const date = new Date(f.starting_at || '');
                    if (isNaN(date.getTime()) || date > new Date()) continue;
                    matches.push({ h: home.name, a: away.name, hg, ag, date });
                  }
                  page++;
                  await sleep(300);
                }
                console.log(`  ${season.name}: ${matches.length} kampe akkumuleret`);
              }
            } catch(e) { console.log(`  Sportmonks fejl: ${e.message}`); }
            return matches;
          }
 
          // ── DIXON-COLES ───────────────────────────────────
          function dcWeight(date, decay) {
            return Math.exp(-decay * (Date.now() - date.getTime()) / 86400000);
          }
 
          function trainDC(matches, decay = 0.005) {
            if (matches.length < 10) return null;
            const teams = {};
            matches.forEach(m => {
              if (!teams[m.h]) teams[m.h] = { att: 1, def: 1 };
              if (!teams[m.a]) teams[m.a] = { att: 1, def: 1 };
            });
            const tn = Object.keys(teams);
            let tw = 0, thg = 0, tag = 0;
            matches.forEach(m => { const w = dcWeight(m.date, decay); tw+=w; thg+=m.hg*w; tag+=m.ag*w; });
            const avgH = tw>0?thg/tw:1.4, avgA = tw>0?tag/tw:1.1;
            const homeAdv = avgA>0?avgH/avgA:1.3;
            for (let it=0; it<60; it++) {
              const an={},ad={},dn={},dd={};
              tn.forEach(t=>{an[t]=0;ad[t]=0;dn[t]=0;dd[t]=0;});
              matches.forEach(m=>{
                const w=dcWeight(m.date,decay),ht=teams[m.h],at=teams[m.a];
                an[m.h]+=w*m.hg; ad[m.h]+=w*at.def*homeAdv*avgA;
                an[m.a]+=w*m.ag; ad[m.a]+=w*ht.def*avgA;
                dn[m.h]+=w*m.ag; dd[m.h]+=w*at.att*avgA;
                dn[m.a]+=w*m.hg; dd[m.a]+=w*ht.att*homeAdv*avgA;
              });
              tn.forEach(t=>{
                if(ad[t]>0) teams[t].att=an[t]/ad[t];
                if(dd[t]>0) teams[t].def=dn[t]/dd[t];
              });
              const ma=tn.reduce((s,t)=>s+teams[t].att,0)/tn.length;
              const md=tn.reduce((s,t)=>s+teams[t].def,0)/tn.length;
              tn.forEach(t=>{teams[t].att/=ma;teams[t].def/=md;});
            }
            return { teams, homeAdv, avgH, avgA, matchCount: matches.length };
          }
 
          // ── MAIN ──────────────────────────────────────────
          async function main() {
            console.log('OddsJaeger nightly update:', new Date().toISOString());
 
            // 1. PINNACLE ODDS
            console.log('\nHenter Pinnacle-odds...');
            try {
              const sr = await fetchUrl(`https://api.the-odds-api.com/v4/sports/?apiKey=${ODDS_API_KEY}`);
              const sports = JSON.parse(sr.body);
              const football = Array.isArray(sports)
                ? sports.filter(s=>s.group==='Soccer'&&s.active).map(s=>s.key) : [];
              let allMatches = [];
              for (let i=0; i<Math.min(football.length,30); i+=5) {
                const batch = football.slice(i,i+5);
                const results = await Promise.all(batch.map(async s => {
                  try {
                    const r = await fetchUrl(`https://api.the-odds-api.com/v4/sports/${s}/odds/?apiKey=${ODDS_API_KEY}&regions=eu&markets=h2h&oddsFormat=decimal&bookmakers=pinnacle`);
                    return JSON.parse(r.body);
                  } catch { return []; }
                }));
                results.forEach(r=>{ if(Array.isArray(r)) allMatches=allMatches.concat(r); });
              }
              console.log(`Hentet ${allMatches.length} kampe med Pinnacle-odds`);
              // Debug: vis hvilke sport_keys der returnerede kampe
              const sportsWithMatches = [...new Set(allMatches.map(m => m.sport_key))];
              console.log(`Sport keys med kampe: ${sportsWithMatches.slice(0,10).join(', ')}`);
              // Debug: vis antal fodboldligaer fundet
              console.log(`Fodboldligaer fundet: ${football.length}`);
              console.log(`Fodboldligaer (første 10): ${football.slice(0,10).join(', ')}`);
              if (allMatches.length > 0) {
                // Kun slet gammel cache hvis vi rent faktisk har nye kampe
                await sbRequest('cached_odds?id=gt.0', 'DELETE');
                for (let i=0; i<allMatches.length; i+=100) {
                  await sbRequest('cached_odds', 'POST', allMatches.slice(i,i+100).map(m=>({
                    match_id:m.id, home_team:m.home_team, away_team:m.away_team,
                    sport_key:m.sport_key, commence_time:m.commence_time, bookmakers:m.bookmakers
                  })));
                }
                console.log('Odds gemt');
              } else {
                console.log('Ingen nye odds - beholder eksisterende cache');
              }
            } catch(e) { console.error('Odds fejl:', e.message); }
 
            // 2. TRÆN MODEL
            console.log('\nTraener model...');
            const modelResults = [];
 
            // Spring modeltræning over ved natkørsel - kun fuld refresh genberegner modellen
            if (!FULL_REFRESH) {
              console.log('\nNatkørsel: springer modeltræning over (model genberegnes kun ved fuld refresh)');
              await sbRequest('settings', 'POST',
                { key:'last_updated', value:new Date().toISOString() },
                { 'Prefer':'resolution=merge-duplicates,return=minimal' });
              console.log('\nFaerdig:', new Date().toISOString());
              return;
            }
 
            // Store ligaer via openfootball (GitHub, gratis, alle sæsoner)
            console.log('\nopenfootball.github.io:');
            for (const cfg of OPENFOOTBALL_LEAGUES) {
              let all = [];
              for (const season of SEASONS) {
                const matches = await fetchOpenfootball(season, cfg.file);
                console.log(`  ${cfg.name} ${season}: ${matches.length} kampe`);
                all = all.concat(matches);
                await sleep(200);
              }
              console.log(`  ${cfg.name} total: ${all.length} kampe`);
              if (all.length < 10) continue;
              const model = trainDC(all);
              if (!model) continue;
              modelResults.push({ league_key:cfg.key, league_name:cfg.name, teams:model.teams,
                home_adv:model.homeAdv, avg_h:model.avgH, avg_a:model.avgA,
                match_count:model.matchCount, updated_at:new Date().toISOString() });
            }
 
            // Superliga: Sportmonks (2024-25, 2025-26) + API-Football (2022-2024)
            console.log('\nSuperliga:');
            let superMatches = [];
 
            // Sportmonks for nyeste sæsoner
            const smMatches = await fetchSportmonksSuperliga();
            console.log(`  Sportmonks: ${smMatches.length} kampe`);
            superMatches = superMatches.concat(smMatches);
 
            // API-Football for historiske sæsoner (2022-2024) ved fuld refresh
            if (FULL_REFRESH) {
              for (const season of [2022, 2023, 2024]) {
                const m = await fetchApiFootball(119, season);
                console.log(`  API-Football ${season}: ${m.length} kampe`);
                // Undgå dubletter - kun tilføj kampe der ikke allerede er i smMatches
                const existing = new Set(superMatches.map(x => `${x.h}-${x.a}-${x.date.toISOString().slice(0,10)}`));
                const newMatches = m.filter(x => !existing.has(`${x.h}-${x.a}-${x.date.toISOString().slice(0,10)}`));
                superMatches = superMatches.concat(newMatches);
                await sleep(1000);
              }
            }
 
            console.log(`  Superliga total: ${superMatches.length} kampe`);
            if (superMatches.length >= 10) {
              const model = trainDC(superMatches);
              if (model) modelResults.push({ league_key:'superliga', league_name:'Superliga 🇩🇰',
                teams:model.teams, home_adv:model.homeAdv, avg_h:model.avgH, avg_a:model.avgA,
                match_count:model.matchCount, updated_at:new Date().toISOString() });
            }
 
            // Gem model
            if (modelResults.length > 0) {
              await sbRequest('model_ratings?id=gt.0', 'DELETE');
              for (const row of modelResults) {
                await sbRequest('model_ratings', 'POST', row);
                await sleep(100);
              }
              const tc = modelResults.reduce((s,l)=>s+Object.keys(l.teams).length,0);
              console.log(`\nModel gemt: ${modelResults.length} ligaer, ${tc} hold`);
              console.log('Ligaer:', modelResults.map(l=>l.league_name).join(', '));
            }
 
            await sbRequest('settings', 'POST',
              { key:'last_updated', value:new Date().toISOString() },
              { 'Prefer':'resolution=merge-duplicates,return=minimal' });
 
            console.log('\nFaerdig:', new Date().toISOString());
          }
 
          main().catch(e=>{ console.error('FATAL:', e.message); process.exit(1); });
          SCRIPT
